#example
---
SOURCES:
  - VCS:     git
    REPO:    ssh://git@git.iter.org/heat/lion.git
    VERSION: master
    DIR:     lion

MODULES: [IMAS-Fortran, IMAS-Python, iWrap, INTERPOS, XMLlib]

BUILDS: 
  - DIR: lion
    CMD: make -C src_f90/ clean veryclean libraries IMAS_ENVIRONMENT_LOADED=yes DEBUG=no F90="$FC"

ACTORS: 
  - DIR: lion
    CMD: make -C src_f90/ iwrap_actor IMAS_ENVIRONMENT_LOADED=yes DEBUG=no F90="$FC"

