#example
---
SOURCES:
  - VCS:  git
    REPO: ssh://git@git.iter.org/heat/toray.git
    VERSION: master
    DIR: toray

MODULES: [IMAS-Fortran, IMAS-Python, iWrap, XMLlib]

BUILDS: 
  - DIR: toray
    CMD:
      - cd lib/nag && FC="$FC" ./naglib.mk
      - cd lib/netlib && FC="$FC" ./netlib.mk
      - cd lib/ppplib && FC="$FC" ./ppplib.mk
      - FC="$FC" make -f make/makefile_imas clean libtoray.a 

ACTORS: 
  - DIR: toray
    CMD: make -f make/makefile_imas actor FC="$FC"

