SOURCES:
  - VCS:     git
    REPO:    ssh://git@git.iter.org/heat/nbisim.git
    VERSION: develop
    DIR:     nbisim

MODULES: [IMAS-Python, iWrap, INTERPOS, XMLlib, IMAS-Fortran]

BUILDS: 
  - DIR: nbisim
    CMD: make -C devel/ veryclean veryclean-deps DATAMODEL=IMAS DEBUG=yes FC="$FC"

ACTORS: 
  - DIR: nbisim
    CMD: make -C devel/ iwrap_actor FC="$FC" DEBUG=yes

