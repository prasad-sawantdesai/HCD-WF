#example
---
SOURCES:
  - VCS:  git
    REPO: ssh://git@git.iter.org/heat/relax.git
    VERSION: develop
    DIR: relax

MODULES: [IMAS-Python, iWrap, XMLlib, IMAS-Fortran]

BUILDS: 
  - DIR: relax
    CMD:
      - cd lib/nag && FC="$FC" ./naglib.mk
      - cd lib/netlib && FC="$FC" ./netlib.mk
      - cd lib/ppplib && FC="$FC" ./ppplib.mk
      - FC="$FC" make -f make/makefile_imas clean librelax.a 

ACTORS: 
  - DIR: relax
    CMD: make -f make/makefile_imas clean actor FC="$FC"

